<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent Calculator</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e3e3e6;
    --text: #1a1a1a;
    --muted: #6b6b70;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field {
    margin-bottom: 12px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .item-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .item-row input[type="text"] { flex: 1.3; }
  .item-row input[type="number"] { flex: 1; }
  .item-row button {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .item-row button:hover { color: #d33; border-color: #d33; }
  .add-btn, .primary-btn, .copy-btn {
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }
  .add-btn { margin-top: 4px; }
  .primary-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
    width: 100%;
    padding: 12px;
    font-size: 15px;
  }
  .primary-btn:hover { background: var(--accent-hover); }
  .split-row {
    display: flex;
    gap: 12px;
  }
  .split-row .field { flex: 1; }
  .lang-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .lang-toggle button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #output {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.6;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 60px;
    word-break: break-word;
  }
  .copy-btn {
    margin-top: 10px;
    width: 100%;
  }
  .copy-btn.copied {
    background: #16a34a;
    color: #fff;
    border-color: #16a34a;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rent Calculator</h1>
  <p class="sub">Split rent & bills, generate a ready-to-send message.</p>

  <div class="card">
    <h2>Who</h2>
    <div class="split-row">
      <div class="field">
        <label for="payerName">Payer's name (you)</label>
        <input type="text" id="payerName" placeholder="e.g. 光勇" value="光勇">
      </div>
      <div class="field">
        <label for="payerZelle">Payer's Zelle</label>
        <input type="text" id="payerZelle" placeholder="e.g. ktwu@utexas.edu" value="ktwu@utexas.edu">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Items paid</h2>
    <div id="items"></div>
    <button class="add-btn" onclick="addItem()">+ Add item</button>
  </div>

  <div class="card">
    <h2>Split</h2>
    <div class="field">
      <label for="otherShare">Other person's share (%)</label>
      <input type="number" id="otherShare" value="50" min="0" max="100" step="1">
    </div>
  </div>

  <div class="card">
    <h2>Language</h2>
    <div class="lang-toggle">
      <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
      <button id="btn-en" onclick="setLang('en')">English</button>
    </div>
    <button class="primary-btn" onclick="generate()">Generate message</button>
  </div>

  <div class="card">
    <h2>Message</h2>
    <div id="output">Fill in the items above and click "Generate message".</div>
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy to clipboard</button>
  </div>

  <footer>Pure HTML/CSS/JS. Nothing is sent anywhere; runs entirely in your browser.</footer>
</div>

<script>
let lang = 'zh';

function setLang(l) {
  lang = l;
  document.getElementById('btn-zh').classList.toggle('active', l === 'zh');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
}

function addItem(name = '', amount = '') {
  const container = document.getElementById('items');
  const row = document.createElement('div');
  row.className = 'item-row';
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="e.g. Rent+utility" value="${escapeAttr(name)}">
    <input type="number" class="item-amount" placeholder="0.00" step="0.01" value="${escapeAttr(amount)}">
    <button onclick="this.parentElement.remove()" title="Remove">&times;</button>
  `;
  container.appendChild(row);
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}

function fmt(n) {
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getItems() {
  const rows = document.querySelectorAll('.item-row');
  const items = [];
  rows.forEach(row => {
    const name = row.querySelector('.item-name').value.trim();
    const amount = parseFloat(row.querySelector('.item-amount').value);
    if (name && !isNaN(amount)) {
      items.push({ name, amount });
    }
  });
  return items;
}

function generate() {
  const items = getItems();
  const payerName = document.getElementById('payerName').value.trim() || (lang === 'zh' ? '朋友' : 'Friend');
  const payerZelle = document.getElementById('payerZelle').value.trim();
  const otherSharePct = parseFloat(document.getElementById('otherShare').value);
  const output = document.getElementById('output');

  if (items.length === 0) {
    output.textContent = lang === 'zh' ? '请至少填写一项费用。' : 'Please add at least one item.';
    return;
  }
  if (isNaN(otherSharePct) || otherSharePct < 0 || otherSharePct > 100) {
    output.textContent = lang === 'zh' ? '请输入 0-100 之间的分摊比例。' : 'Please enter a share between 0 and 100.';
    return;
  }

  const total = items.reduce((sum, it) => sum + it.amount, 0);
  const shareFraction = otherSharePct / 100;
  const otherOwes = total * shareFraction;

  const itemsList = items.map(it => `${it.name} ${fmt(it.amount)} usd`).join(' + ');
  const sumExpr = items.map(it => fmt(it.amount)).join('+');
  const shareLabel = otherSharePct === 50 ? (lang === 'zh' ? '一半' : 'half') : `${otherSharePct}%`;
  const shareExpr = otherSharePct === 50
    ? `${fmt(total)}/2=${fmt(otherOwes)}`
    : `${fmt(total)}*${otherSharePct}%=${fmt(otherOwes)}`;

  let msg;
  if (lang === 'zh') {
    msg =
`${payerName}，${itemsList}，这些都是我付，一共是${sumExpr}=${fmt(total)}，你给我${shareLabel}（${shareExpr}）就可以。🙏感谢，我的Zelle是${payerZelle}`;
  } else {
    msg =
`Hi ${payerName}, I paid ${itemsList}, total = ${sumExpr} = ${fmt(total)}. Your share is ${shareLabel} (${shareExpr}). 🙏 Thanks! My Zelle is ${payerZelle}`;
  }

  output.textContent = msg;
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('copyBtn').textContent = 'Copy to clipboard';
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy to clipboard';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// seed with the example from the scenario
addItem('Rent+utility', 1639.96);
addItem('transaction fee', 10);
addItem('spectrum', 65.33);
</script>
</body>
</html>
