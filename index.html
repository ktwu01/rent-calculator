<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent Calculator</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e3e3e6;
    --text: #1a1a1a;
    --muted: #6b6b70;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field {
    margin-bottom: 12px;
  }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .preset-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .preset-btn {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
  }
  .preset-btn.active {
    border-color: var(--accent);
    background: #eef3ff;
    color: var(--accent);
    font-weight: 600;
  }

  .item-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .item-row input[type="text"] { flex: 1.2; min-width: 0; }
  .item-row input[type="number"] { flex: 0.8; min-width: 0; }
  .payer-toggle {
    flex: 0 0 auto;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .payer-toggle button {
    border: none;
    background: #fff;
    color: var(--muted);
    padding: 9px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .payer-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .item-row .remove-btn {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  .item-row .remove-btn:hover { color: #d33; border-color: #d33; }

  .add-btn, .primary-btn, .copy-btn {
    cursor: pointer;
    border-radius: 8px;
    font-size: 14px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }
  .add-btn { margin-top: 4px; }
  .primary-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
    width: 100%;
    padding: 12px;
    font-size: 15px;
  }
  .primary-btn:hover { background: var(--accent-hover); }

  .lang-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .lang-toggle button {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  #output {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.6;
    background: #fafafa;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    min-height: 60px;
    word-break: break-word;
  }
  .copy-btn {
    margin-top: 10px;
    width: 100%;
  }
  .copy-btn.copied {
    background: #16a34a;
    color: #fff;
    border-color: #16a34a;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Rent Calculator</h1>
  <p class="sub">Track who paid what, get the one next thing to do.</p>

  <div class="card">
    <h2>This month's pattern</h2>
    <div class="preset-row" id="presets">
      <button class="preset-btn" data-preset="me">I pay for all</button>
      <button class="preset-btn" data-preset="roommate">Roommate pays for all</button>
      <button class="preset-btn active" data-preset="custom">Custom (mix per item)</button>
    </div>
  </div>

  <div class="card">
    <h2>Roommate's name & your Zelle</h2>
    <div class="field">
      <label for="roommateName">Roommate's name</label>
      <input type="text" id="roommateName" placeholder="e.g. 光勇" value="光勇">
    </div>
    <div class="field">
      <label for="payerZelle">Your Zelle (shown when they owe you)</label>
      <input type="text" id="payerZelle" placeholder="e.g. ktwu@utexas.edu" value="ktwu@utexas.edu">
    </div>
  </div>

  <div class="card">
    <h2>Items this month</h2>
    <div id="items"></div>
    <button class="add-btn" onclick="addItem()">+ Add item</button>
  </div>

  <div class="card">
    <h2>Language</h2>
    <div class="lang-toggle">
      <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
      <button id="btn-en" onclick="setLang('en')">English</button>
    </div>
    <button class="primary-btn" onclick="generate()">What do I do next?</button>
  </div>

  <div class="card">
    <h2>Next action</h2>
    <div id="output">Fill in the items above and click "What do I do next?".</div>
    <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy message</button>
  </div>

  <footer>Pure HTML/CSS/JS. Nothing is sent anywhere; runs entirely in your browser.</footer>
</div>

<script>
let lang = 'zh';
let defaultPayer = 'custom'; // 'me' | 'roommate' | 'custom'

function setLang(l) {
  lang = l;
  document.getElementById('btn-zh').classList.toggle('active', l === 'zh');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
}

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    defaultPayer = btn.dataset.preset;
    if (defaultPayer !== 'custom') {
      document.querySelectorAll('.item-row').forEach(row => setRowPayer(row, defaultPayer));
    }
  });
});

function setRowPayer(row, payer) {
  row.dataset.payer = payer;
  row.querySelectorAll('.payer-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.payer === payer);
  });
}

function addItem(name = '', amount = '', payer = null) {
  const container = document.getElementById('items');
  const row = document.createElement('div');
  row.className = 'item-row';
  const initialPayer = payer || (defaultPayer === 'custom' ? 'me' : defaultPayer);
  row.innerHTML = `
    <input type="text" class="item-name" placeholder="e.g. Rent+utility" value="${escapeAttr(name)}">
    <input type="number" class="item-amount" placeholder="0.00" step="0.01" value="${escapeAttr(amount)}">
    <div class="payer-toggle">
      <button type="button" data-payer="me" onclick="setRowPayer(this.closest('.item-row'),'me')">Me</button>
      <button type="button" data-payer="roommate" onclick="setRowPayer(this.closest('.item-row'),'roommate')">Them</button>
    </div>
    <button class="remove-btn" onclick="this.parentElement.remove()" title="Remove">&times;</button>
  `;
  container.appendChild(row);
  setRowPayer(row, initialPayer);
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}

function fmt(n) {
  return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getItems() {
  const rows = document.querySelectorAll('.item-row');
  const items = [];
  rows.forEach(row => {
    const name = row.querySelector('.item-name').value.trim();
    const amount = parseFloat(row.querySelector('.item-amount').value);
    const payer = row.dataset.payer;
    if (name && !isNaN(amount)) {
      items.push({ name, amount, payer });
    }
  });
  return items;
}

function generate() {
  const items = getItems();
  const roommateName = document.getElementById('roommateName').value.trim() || (lang === 'zh' ? '室友' : 'roommate');
  const payerZelle = document.getElementById('payerZelle').value.trim();
  const output = document.getElementById('output');

  if (items.length === 0) {
    output.textContent = lang === 'zh' ? '请至少填写一项费用。' : 'Please add at least one item.';
    return;
  }

  const total = items.reduce((sum, it) => sum + it.amount, 0);
  const paidByMe = items.filter(it => it.payer === 'me').reduce((s, it) => s + it.amount, 0);
  const paidByRoommate = total - paidByMe;
  const halfTotal = total / 2;
  // positive: roommate owes me. negative: I owe roommate.
  const netToMe = paidByMe - halfTotal;

  const meList = items.filter(it => it.payer === 'me').map(it => `${it.name} ${fmt(it.amount)} usd`).join(' + ');
  const roommateList = items.filter(it => it.payer === 'roommate').map(it => `${it.name} ${fmt(it.amount)} usd`).join(' + ');

  let msg;
  const amt = fmt(netToMe);

  if (Math.abs(netToMe) < 0.005) {
    msg = lang === 'zh'
      ? `本月账已经打平，${roommateName}不用给我钱，我也不用给${roommateName}钱。`
      : `Everything's settled this month, no one owes anyone.`;
  } else if (netToMe > 0) {
    // roommate owes me
    if (lang === 'zh') {
      msg = `${roommateName}，` +
        (meList ? `${meList}，这些都是我付，` : '') +
        (roommateList ? `${roommateList}，这些是你付，` : '') +
        `这个月一共${fmt(total)}，你给我${amt}（${fmt(paidByMe)}-${fmt(halfTotal)}=${amt}）就可以。🙏感谢，我的Zelle是${payerZelle}`;
    } else {
      msg = `Hi ${roommateName}, ` +
        (meList ? `I paid ${meList}. ` : '') +
        (roommateList ? `You paid ${roommateList}. ` : '') +
        `Total this month is ${fmt(total)}. You owe me ${amt} (${fmt(paidByMe)} - ${fmt(halfTotal)} = ${amt}). 🙏 Thanks! My Zelle is ${payerZelle}`;
    }
  } else {
    // I owe roommate
    if (lang === 'zh') {
      msg = `${roommateName}，` +
        (roommateList ? `${roommateList}，这些是你付，` : '') +
        (meList ? `${meList}，这些是我付，` : '') +
        `这个月一共${fmt(total)}，我欠你${amt}，我会用Zelle转给你，麻烦告诉我你的Zelle账号。`;
    } else {
      msg = `Hi ${roommateName}, ` +
        (roommateList ? `you paid ${roommateList}. ` : '') +
        (meList ? `I paid ${meList}. ` : '') +
        `Total this month is ${fmt(total)}. I owe you ${amt}. I'll send it via Zelle, please share your Zelle handle.`;
    }
  }

  output.textContent = msg;
  document.getElementById('copyBtn').classList.remove('copied');
  document.getElementById('copyBtn').textContent = 'Copy message';
}

function copyOutput() {
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy message';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// seed with the example from the scenario: I paid everything
addItem('Rent+utility', 1639.96, 'me');
addItem('transaction fee', 10, 'me');
addItem('spectrum', 65.33, 'me');
</script>
</body>
</html>
